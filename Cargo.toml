[package]
name = "Nyx"
version = "1.0.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "process"] }
chrono = "0.4"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
poise = "0.6.1"
regex = "1.12.2"
thiserror = "2.0.18"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
hex_color = "3"
sysinfo = "0.30"
kamadak-exif = "0.6"
reqwest = { version = "0.13", features = ["rustls"]}
image = "0.25.10"
url = "2.5.8"
